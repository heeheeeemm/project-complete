  <style>
    .book-cover,.detail-cover,.preview-image{position:relative}
    .real-book-cover{position:absolute;max-width:72%;height:78%;object-fit:contain;filter:drop-shadow(6px 10px 9px #253c322b);z-index:2}
    .detail-cover .real-book-cover{height:85%;max-width:85%}
    .cover-ready .mini-book,.cover-ready .cover-label,.cover-ready .cover-number{visibility:hidden}
    .cover-preview{display:flex;align-items:center;gap:22px;padding:20px;border:1px solid var(--line);border-radius:12px;background:#f2f4ea}
    .cover-preview[hidden]{display:none}
    .preview-image{display:flex;align-items:center;justify-content:center;flex:none;width:100px;height:135px;background:#e3ead9;border-radius:8px}
    .preview-image .mini-book{width:62px;height:92px;padding:10px}
    .preview-image .mini-book-title{font-size:12px}
    .preview-image .real-book-cover{height:88%;max-width:85%}
    .cover-credit{font-size:11px;color:var(--muted)}
    .cover-credit a{color:inherit}
    .genre-filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 27px;padding-bottom:20px;border-bottom:1px solid var(--line)}
    .genre-filter{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:30px;padding:7px 17px;font-size:12px;color:#75806a;text-decoration:none;background:#fffefa;transition:background .15s,color .15s}
    .genre-filter:hover{background:#e8eedf;color:var(--green);border-color:#b7c5a8}
    .genre-filter.is-active{background:var(--green);border-color:var(--green);color:white;font-weight:600}
    .genre-pill{display:inline-block;background:#e9eedf;color:#667c54;font-size:10px;padding:2px 9px;border-radius:5px;margin-bottom:8px}
    .subgenre-filters{margin-top:-12px;background:#eef1e7;border:0;border-radius:12px;padding:15px;align-items:center}
    .subgenre-filters .genre-filter{font-size:11px;padding:5px 13px}
    .subgenre-label{font-size:11px;color:#849277;padding:0 8px 0 2px}
    .subgenre-picker{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 25px}
    .subgenre-picker label{font-size:12px;font-weight:600;color:#687a5d}
    .subgenre-picker .form-select{width:auto;min-width:210px;max-width:100%;font-size:12px;min-height:40px;padding:8px 35px 8px 12px}
    .subgenre-picker .btn{padding:8px 17px}
    .filter-result{font-size:12px;color:#87917f;display:flex;align-items:center;gap:8px;margin:0 0 20px;flex-wrap:wrap}
    .filter-result strong{font-weight:500;color:#506647}.filter-result a{margin-left:auto;text-decoration:none;font-size:11px}
    @media(max-width:420px){.cover-preview{padding:14px;gap:15px}.preview-image{width:80px;height:110px}}

            <li class="nav-item"><a class="nav-link" href="{% url 'books:create' %}">도서 등록</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'accounts:profile' request.user.username %}">내 프로필</a></li>
            <li class="nav-item"><form action="{% url 'accounts:logout' %}" method="POST">{% csrf_token %}<button class="btn nav-link" type="submit">로그아웃</button></form></li>
          {% else %}
            <li class="nav-item"><a class="nav-link" href="{% url 'accounts:login' %}">로그인</a></li>
            <li class="nav-item"><a class="nav-cta" href="{% url 'accounts:signup' %}">회원가입</a></li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>
  <main class="container page-main">
    {% for message in messages %}<div class="alert alert-{{ message.tags }}" role="alert">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock content %}
  </main>
  <footer class="site-footer"><div class="container footer-inner"><span>책담 · 책과 이야기가 머무는 곳</span><span>한 권의 책, 또 하나의 세계.</span></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script>
    if (!window.bootstrap) {
      document.querySelectorAll('[data-bs-toggle="collapse"]').forEach(button => {
        button.addEventListener('click', () => {
          const menu = document.querySelector(button.dataset.bsTarget);
          if (menu) button.setAttribute('aria-expanded', String(menu.classList.toggle('show')));
        });
      });
    }
  </script>
  <script>
    (() => {
      const genre = document.getElementById('id_genre');
      const subgenre = document.getElementById('id_subgenre');
      const options = document.getElementById('subgenre-options');
      if (!genre || !subgenre || !options) return;
      const groups = JSON.parse(options.textContent);
      function updateSubgenres() {
        const selected = subgenre.value;
        const choices = groups[genre.value] || [];
        subgenre.replaceChildren(new Option(choices.length ? '세부 장르 선택 (선택사항)' : '먼저 장르를 선택해 주세요', ''));
        choices.forEach(([value, label]) => subgenre.add(new Option(label, value)));
        subgenre.value = choices.some(([value]) => value === selected) ? selected : '';
        subgenre.disabled = choices.length === 0;
      }
      genre.addEventListener('change', updateSubgenres);
      updateSubgenres();
    })();
  </script>
  <script>
    (() => {
      const endpoint = "{% url 'books:cover_lookup' %}";
      const requests = new Map();
      function findCover(title, author) {
        const key = JSON.stringify([title, author]);
        if (!requests.has(key)) {
          const query = new URLSearchParams({title, author});
          requests.set(key, fetch(endpoint + '?' + query, {headers: {Accept: 'application/json'}})
            .then(response => response.ok ? response.json() : Promise.reject(new Error('lookup failed')))
            .catch(() => ({url: ''})));
        }
        return requests.get(key);
      }
      function clearCover(container) {
        container.querySelectorAll('.real-book-cover').forEach(image => image.remove());
        container.classList.remove('cover-ready');
      }
      async function showCover(container, title, author) {
        const token = (container.coverToken || 0) + 1;
        container.coverToken = token;
        clearCover(container);
        const preview = container.closest('[data-cover-preview]');
        const credit = (preview || container.parentElement).querySelector('.cover-credit');
        const status = preview && preview.querySelector('[data-cover-status]');
        if (credit) { credit.replaceChildren(); credit.hidden = true; }
        if (status) status.textContent = '표지를 찾고 있어요…';
        const data = await findCover(title, author);
        if (container.coverToken !== token) return;
        const missing = () => {
          if (container.coverToken !== token) return;
          clearCover(container);
          if (credit) credit.hidden = true;
          if (status) status.textContent = '표지를 찾지 못했어요. 제목과 저자를 확인해 주세요. 등록하면 기본 표지로 표시됩니다.';
        };
        if (!data.url) { missing(); return; }
        const image = new Image();
        image.className = 'real-book-cover';
        image.alt = title + ' 책 표지';
        image.referrerPolicy = 'no-referrer';
        image.decoding = 'async';
        image.onload = () => {
          if (container.coverToken !== token) return;
          container.append(image);
          container.classList.add('cover-ready');
          if (status) status.textContent = '책 표지를 찾았어요. 등록 후 서가에도 표시됩니다.';
          if (credit && data.source_url) {
            const link = document.createElement('a');
            link.href = data.source_url;
            link.textContent = '표지 · ' + data.source;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            credit.replaceChildren(link);
            credit.hidden = false;
          }
        };
        image.onerror = missing;
        image.src = data.url;
      }
      const covers = document.querySelectorAll('[data-book-cover][data-cover-title]');
      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const container = entry.target;
              observer.unobserve(container);
              showCover(container, container.dataset.coverTitle, container.dataset.coverAuthor || '');
            }
          });
        }, {rootMargin: '200px'});
        covers.forEach(container => observer.observe(container));
      } else {
        covers.forEach(container => showCover(container, container.dataset.coverTitle, container.dataset.coverAuthor || ''));
      }
      const preview = document.querySelector('[data-cover-preview]');
      const titleInput = document.getElementById('id_title');
      const authorInput = document.getElementById('id_author');
      if (preview && titleInput && authorInput) {
        const container = preview.querySelector('[data-book-cover]');
        let debounce;
        function update() {
          clearTimeout(debounce);
          container.coverToken = (container.coverToken || 0) + 1;
          clearCover(container);
          const title = titleInput.value.trim();
          const author = authorInput.value.trim();
          preview.hidden = !title;
          preview.querySelector('.cover-credit').hidden = true;
          preview.querySelector('[data-cover-status]').textContent = '제목과 저자로 표지를 찾고 있어요.';
          if (title) debounce = setTimeout(() => showCover(container, title, author), 700);
        }
        titleInput.addEventListener('input', update);
        authorInput.addEventListener('input', update);
        update();
      }
    })();
  </script>
</body>
</html>
