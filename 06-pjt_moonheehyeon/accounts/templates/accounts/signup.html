{% extends 'base.html' %}
{% block title %}회원가입 | 책 이야기{% endblock title %}
{% block content %}
<div class="form-shell">
  <nav class="breadcrumb" aria-label="현재 위치"><a href="{% url 'accounts:login' %}">로그인</a><span aria-hidden="true">/</span><span>회원가입</span></nav>
  <section class="panel form-panel">
    <header class="form-header"><p class="eyebrow">YOUR READING STORY</p><h1>회원가입</h1><p>책을 좋아하는 당신을 위한 작은 커뮤니티.</p></header>
    
    <form action="{% url 'accounts:signup' %}" method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      {% include 'includes/form_fields.html' %}
      <div class="form-actions"><button class="button" type="submit">회원가입</button><a class="text-link" href="{% url 'accounts:login' %}">로그인</a></div>
    </form>
    <p class="form-after">이미 함께하고 계신가요? <a href="{% url 'accounts:login' %}">로그인</a></p>
  </section>
</div>
{% endblock content %}
