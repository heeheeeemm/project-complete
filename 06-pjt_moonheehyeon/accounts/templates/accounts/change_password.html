{% extends 'base.html' %}
{% block title %}비밀번호 변경 | 책 이야기{% endblock title %}
{% block content %}
<div class="form-shell">
  <nav class="breadcrumb" aria-label="현재 위치"><a href="{% url 'accounts:profile' request.user.username %}">내 프로필</a><span aria-hidden="true">/</span><span>비밀번호 변경</span></nav>
  <section class="panel form-panel">
    <header class="form-header"><p class="eyebrow">YOUR READING STORY</p><h1>비밀번호 변경</h1><p>안전한 비밀번호로 계정을 보호하세요.</p></header>
    
    <form action="{% url 'accounts:change_password' %}" method="POST">
      {% csrf_token %}
      {% include 'includes/form_fields.html' %}
      <div class="form-actions"><button class="button" type="submit">비밀번호 변경</button><a class="text-link" href="{% url 'accounts:profile' request.user.username %}">내 프로필</a></div>
    </form>
    
  </section>
</div>
{% endblock content %}
