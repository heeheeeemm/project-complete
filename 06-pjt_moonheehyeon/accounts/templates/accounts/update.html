{% extends 'base.html' %}
{% block title %}회원정보 수정 | 책 이야기{% endblock title %}
{% block content %}
<div class="form-shell">
  <nav class="breadcrumb" aria-label="현재 위치"><a href="{% url 'accounts:profile' request.user.username %}">내 프로필</a><span aria-hidden="true">/</span><span>회원정보 수정</span></nav>
  <section class="panel form-panel">
    <header class="form-header"><p class="eyebrow">YOUR READING STORY</p><h1>회원정보 수정</h1><p>당신의 독서 프로필을 조금 더 채워주세요.</p></header>
    
    <form action="{% url 'accounts:update' %}" method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      {% include 'includes/form_fields.html' %}
      <div class="form-actions"><button class="button" type="submit">저장</button><a class="text-link" href="{% url 'accounts:profile' request.user.username %}">내 프로필</a></div>
    </form>
    <p class="form-after"><a href="{% url 'accounts:change_password' %}">비밀번호 변경</a></p>
  </section>
</div>
{% endblock content %}
