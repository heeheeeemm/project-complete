{% extends 'base.html' %}
{% block title %}쓰레드 작성 | 책 이야기{% endblock title %}
{% block content %}
<div class="form-shell">
  <nav class="breadcrumb" aria-label="현재 위치"><a href="{% url 'books:detail' book.pk %}">도서 상세</a><span aria-hidden="true">/</span><span>쓰레드 작성</span></nav>
  <section class="panel form-panel">
    <header class="form-header"><p class="eyebrow">YOUR READING STORY</p><h1>쓰레드 작성</h1><p>책을 읽으며 떠오른 생각을 자유롭게 남겨주세요.</p></header>
    <p class="form-context">함께 읽는 책 · {{ book.title }}</p>
    <form action="{% url 'books:thread_create' book.pk %}" method="POST">
      {% csrf_token %}
      {% include 'includes/form_fields.html' %}
      <div class="form-actions"><button class="button" type="submit">쓰레드 등록</button><a class="text-link" href="{% url 'books:detail' book.pk %}">도서 상세</a></div>
    </form>
    
  </section>
</div>
{% endblock content %}
