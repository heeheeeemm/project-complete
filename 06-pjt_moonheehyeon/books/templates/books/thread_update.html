{% extends 'base.html' %}
{% block title %}쓰레드 수정 | 책 이야기{% endblock title %}
{% block content %}
<div class="form-shell">
  <nav class="breadcrumb" aria-label="현재 위치"><a href="{% url 'books:thread_detail' thread.pk %}">쓰레드 상세</a><span aria-hidden="true">/</span><span>쓰레드 수정</span></nav>
  <section class="panel form-panel">
    <header class="form-header"><p class="eyebrow">YOUR READING STORY</p><h1>쓰레드 수정</h1><p>남겨둔 감상에 새로운 생각을 더해보세요.</p></header>
    <p class="form-context">함께 읽는 책 · {{ thread.book.title }}</p>
    <form action="{% url 'books:thread_update' thread.pk %}" method="POST">
      {% csrf_token %}
      {% include 'includes/form_fields.html' %}
      <div class="form-actions"><button class="button" type="submit">수정 저장</button><a class="text-link" href="{% url 'books:thread_detail' thread.pk %}">쓰레드 상세</a></div>
    </form>
    
  </section>
</div>
{% endblock content %}
