{% extends 'base.html' %}
{% block title %}도서 수정 | 책 이야기{% endblock title %}
{% block content %}
<div class="form-shell">
  <nav class="breadcrumb" aria-label="현재 위치"><a href="{% url 'books:detail' book.pk %}">도서 상세</a><span aria-hidden="true">/</span><span>도서 수정</span></nav>
  <section class="panel form-panel">
    <header class="form-header"><p class="eyebrow">YOUR READING STORY</p><h1>도서 수정</h1><p>책의 소개와 리뷰 평점을 다듬어보세요.</p></header>
    
    <form action="{% url 'books:update' book.pk %}" method="POST">
      {% csrf_token %}
      {% include 'includes/form_fields.html' %}
      <div class="form-actions"><button class="button" type="submit">저장</button><a class="text-link" href="{% url 'books:detail' book.pk %}">도서 상세</a></div>
    </form>
    
  </section>
</div>
{% endblock content %}
