{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#246449">
  <title>{% block title %}책 이야기{% endblock title %}</title>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/community.css' %}">
  <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">본문으로 바로가기</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{% url 'books:index' %}"><span class="brand-mark" aria-hidden="true">冊</span>책 이야기<span class="brand-note">읽고, 나누고, 연결하다</span></a>
      <nav class="header-nav d-flex align-items-center flex-wrap" aria-label="주 메뉴">
        <a class="nav-link" href="{% url 'books:index' %}">도서 목록</a>
        {% if request.user.is_authenticated %}
          <a class="nav-link" href="{% url 'books:create' %}">도서 등록</a>
          <a class="nav-link" href="{% url 'accounts:profile' request.user.username %}">내 프로필</a>
          <form class="inline-form" action="{% url 'accounts:logout' %}" method="POST">{% csrf_token %}<button class="button button-small button-quiet" type="submit">로그아웃</button></form>
        {% else %}
          <a class="nav-link" href="{% url 'accounts:login' %}">로그인</a>
          <a class="button button-small" href="{% url 'accounts:signup' %}">회원가입</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main class="site-main" id="main-content" tabindex="-1">{% block content %}{% endblock content %}</main>
  <footer class="site-footer"><a href="{% url 'books:index' %}">책 이야기</a><span>한 권의 책에서 시작되는 대화.</span><span class="footer-note">함께 읽는 즐거움</span></footer>
</body>
</html>
