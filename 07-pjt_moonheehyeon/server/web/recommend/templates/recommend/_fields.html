{{ form.non_field_errors }}
{% for field in form %}
<div class="form-field">
  {% if field.field.widget.input_type == 'checkbox' %}
    <label class="checkbox-row" for="{{ field.id_for_label }}">{{ field }}<span>{{ field.label }}</span></label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}
  {% endif %}
  {{ field.errors }}{% if field.help_text %}<div class="field-help">{{ field.help_text }}</div>{% endif %}
</div>
{% endfor %}
