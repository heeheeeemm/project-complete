{% extends 'base.html' %}
{% block content %}
<div class="page-title"><p class="eyebrow">LET'S FIND ANOTHER STORY</p><h1>우리, 다른 이야기를 찾아볼까요?</h1><p>모두가 편안하게 책을 만날 수 있도록 일부 요청에는 답변을 드리지 않아요.</p></div>
<div class="panes">
  <div class="pane">
    <h3>당신이 남긴 이야기</h3>
    <div class="result">{{ user_input }}</div>
    <a class="back" href="{% url request.resolver_match.view_name %}">← 다시 입력</a>
  </div>
  <div class="pane">
    <h3>새로운 이야기를 기다릴게요</h3>
    <div class="notice reject">
      이 요청에는 답변하기 어려워요.<br>
      <small>다른 취향이나 책에 관한 질문을 들려주세요. · 요청 거절 403</small>
    </div>
  </div>
</div>
{% endblock content %}
